<!DOCTYPE html>
<html>

<head>
    <title>Face Attendance System</title>

    <link rel="stylesheet" href="../static/style.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

</head>

<body>

    <div class="dashboard">

        <div class="sidebar">

            <h2>Dashboard</h2>

            <ul>

                <li>


                    <a href="/register" style="text-decoration:none;color:white;">
                        Student Registration
                    </a>
                </li>

                <li>
                    <a href="/students" style="text-decoration:none;color:white;">
                        View Students
                    </a>
                </li>


                <li>Mark Attendance</li>

                <li>Attendance Details</li>

                <li onclick="logout()" style="color:red;cursor:pointer;">Logout</li>

            </ul>

        </div>

        <div class="main-content">

            <div class="top-datetime">

                <div id="date"></div>

                <div id="time"></div>

            </div>

            <h1 class="main-title">Face Recognition Attendance</h1>

            <p class="subtitle">
                Register Students , Manage Attendance
            </p>

            <div class="feature-container">

                <div class="feature-card">
                    <i class="fas fa-user-plus"></i>
                    <h3>Register Students</h3>
                </div>

                <div class="feature-card">
                    <i class="fas fa-users"></i>
                    <h3> Admin </h3>
                </div>

                <div class="feature-card">
                    <i class="fas fa-camera"></i>
                    <h3>Mark Attendance</h3>
                </div>



                <div class="feature-card">
                    <i class="fas fa-list"></i>
                    <h3>View Attendance</h3>
                </div>


                <div class="feature-card">
                    <i class="fas fa-cog"></i>
                    <h3>Configure Camera</h3>
                </div>

            </div>

        </div>

    </div>

    <script src="../static/script.js"></script>

</body>

</html>
